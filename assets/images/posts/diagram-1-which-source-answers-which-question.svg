<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="d1-title" aria-describedby="d1-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="d1-title">Which data source can answer which growth question</title>
  <desc id="d1-desc">A matrix of five growth questions against three data sources. Your own behaviour data is the primary source for positioning and for click and conversion, but structurally cannot answer the whitespace question at all. Market and competitor data is the primary source for whitespace and winnability. Site crawl is the primary source for technical blockers.</desc>
  <text x="491" y="58" text-anchor="middle" font-size="13" fill="#1f2933" opacity=".75">Your own</text>
  <text x="491" y="76" text-anchor="middle" font-size="13" fill="#1f2933" opacity=".75">behaviour data</text>
  <text x="633" y="58" text-anchor="middle" font-size="13" fill="#1f2933" opacity=".75">Market &amp;</text>
  <text x="633" y="76" text-anchor="middle" font-size="13" fill="#1f2933" opacity=".75">competitor data</text>
  <text x="775" y="58" text-anchor="middle" font-size="13" fill="#1f2933" opacity=".75">Site</text>
  <text x="775" y="76" text-anchor="middle" font-size="13" fill="#1f2933" opacity=".75">crawl</text>

  <line x1="20" y1="100" x2="846" y2="100" stroke="#1f2933" opacity=".35"/>
  <line x1="20" y1="360" x2="846" y2="360" stroke="#1f2933" opacity=".35"/>
  <line x1="20" y1="152" x2="846" y2="152" stroke="#1f2933" opacity=".12"/>
  <line x1="20" y1="204" x2="846" y2="204" stroke="#1f2933" opacity=".12"/>
  <line x1="20" y1="256" x2="846" y2="256" stroke="#1f2933" opacity=".12"/>
  <line x1="20" y1="308" x2="846" y2="308" stroke="#1f2933" opacity=".12"/>
  <line x1="420" y1="100" x2="420" y2="360" stroke="#1f2933" opacity=".35"/>
  <line x1="562" y1="100" x2="562" y2="360" stroke="#1f2933" opacity=".12"/>
  <line x1="704" y1="100" x2="704" y2="360" stroke="#1f2933" opacity=".12"/>

  <text x="20" y="131" font-size="13.5" fill="#1f2933">Whitespace — demand we've never captured</text>
  <text x="20" y="183" font-size="13.5" fill="#1f2933">Winnability — can we realistically rank?</text>
  <text x="20" y="235" font-size="13.5" fill="#1f2933">Positioning — is our content aimed right?</text>
  <text x="20" y="287" font-size="13.5" fill="#1f2933">Click &amp; conversion — do they click, then act?</text>
  <text x="20" y="339" font-size="13.5" fill="#1f2933">Technical — is anything mechanically blocking?</text>

  <line x1="484" y1="119" x2="498" y2="133" stroke="#f97316" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="498" y1="119" x2="484" y2="133" stroke="#f97316" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="633" cy="126" r="7" fill="#1f2933"/>
  <line x1="768" y1="126" x2="782" y2="126" stroke="#1f2933" opacity=".25" stroke-width="2"/>

