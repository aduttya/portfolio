<svg xmlns="http://www.w3.org/2000/svg" width="620" height="580" viewBox="0 0 620 580" role="img" aria-labelledby="d2-title" aria-describedby="d2-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="d2-title">Where the language model is allowed in</title>
  <desc id="d2-desc">A six-stage pipeline running top to bottom: aggregate the performance data, rank and flag against the site's own distribution, gate on whether the page is worth a model call, interpret whether the content means what the incoming queries mean, draft the actual replacement text, then run a grounding check. Only the interpret and draft stages use the language model. The grounding check either emits a concrete fix quoting the real title and queries, or emits nothing at all when the facts are missing.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2933"/>
    </marker>
  </defs>

  <rect x="40" y="236" width="540" height="148" rx="10" fill="none" stroke="#f97316" stroke-width="1.6" stroke-dasharray="6 5" opacity=".9"/>
  <text x="580" y="228" text-anchor="end" font-size="12" fill="#f97316">the model's entire job</text>

  <rect x="110" y="16" width="400" height="46" rx="6" fill="none" stroke="#1f2933" stroke-width="1.4" opacity=".55"/>
  <text x="310" y="44" text-anchor="middle" font-size="13.5" fill="#1f2933">Aggregate the performance data</text>

  <rect x="110" y="90" width="400" height="46" rx="6" fill="none" stroke="#1f2933" stroke-width="1.4" opacity=".55"/>
  <text x="310" y="118" text-anchor="middle" font-size="13.5" fill="#1f2933">Rank and flag against the site's own distribution</text>

  <rect x="110" y="164" width="400" height="46" rx="6" fill="none" stroke="#1f2933" stroke-width="1.4" opacity=".55"/>
  <text x="310" y="192" text-anchor="middle" font-size="13.5" fill="#1f2933">Gate: is this page even worth a model call?</text>

  <rect x="110" y="250" width="400" height="46" rx="6" fill="none" stroke="#f97316" stroke-width="1.4"/>
  <text x="310" y="271" text-anchor="middle" font-size="13.5" fill="#1f2933">Interpret: does the content mean</text>
  <text x="310" y="288" text-anchor="middle" font-size="13.5" fill="#1f2933">what the incoming queries mean?</text>

  <rect x="110" y="324" width="400" height="46" rx="6" fill="none" stroke="#f97316" stroke-width="1.4"/>
  <text x="310" y="352" text-anchor="middle" font-size="13.5" fill="#1f2933">Draft: the actual replacement text</text>

  <rect x="110" y="410" width="400" height="46" rx="6" fill="none" stroke="#1f2933" stroke-width="1.4" opacity=".55"/>
  <text x="310" y="438" text-anchor="middle" font-size="13.5" fill="#1f2933">Grounding check: are the real facts present?</text>

  <rect x="10" y="500" width="280" height="56" rx="6" fill="none" stroke="#1f2933" stroke-width="1.4" opacity=".55"/>
  <text x="150" y="524" text-anchor="middle" font-size="13.5" fill="#1f2933">Concrete fix</text>
  <text x="150" y="542" text-anchor="middle" font-size="12" fill="#1f2933" opacity=".75">quoting the real title and queries</text>

  <rect x="330" y="500" width="280" height="56" rx="6" fill="none" stroke="#1f2933" stroke-width="1.4" opacity=".55"/>
  <text x="470" y="524" text-anchor="middle" font-size="13.5" fill="#1f2933">Not computable</text>
  <text x="470" y="542" text-anchor="middle" font-size="12" fill="#1f2933" opacity=".75">emit nothing at all</text>

  <line x1="310" y1="62" x2="310" y2="86" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="310" y1="136" x2="310" y2="160" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="310" y1="210" x2="310" y2="246" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="310" y1="296" x2="310" y2="320" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="310" y1="370" x2="310" y2="406" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="300" y="232" text-anchor="end" font-size="12" fill="#1f2933" opacity=".75">if it clears the gate</text>

  <polyline points="310,456 310,470 150,470 150,496" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>
  <polyline points="310,456 310,470 470,470 470,496" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="142" y="490" text-anchor="end" font-size="12" fill="#1f2933" opacity=".75">facts present</text>
  <text x="478" y="490" font-size="12" fill="#1f2933" opacity=".75">facts missing</text>
</svg>
