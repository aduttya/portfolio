case_studies:
  - id: apex-insights
    name: Apex Insights
    role: Founder, built solo
    period: July 2026 to now
    url: https://aduttya.com/work/apex-insights/
    site: https://www.apexinsights.racing/
    stack: [Next.js, Supabase, Vercel]
    summary: >-
      A GT3 racing data product built solo, from the data pipeline and design to
      the growth. Official race documents become a connected site of driver, team,
      championship and race pages, plus data stories, reels and a podcast.
    results:
      - 6.7x monthly Google impressions, July to October 2026
      - 473 pages, most of them built from race data
      - 411 pages earning impressions on the new domain
      - 100 clicks from Google within a month of moving to the new domain
      - 130 official documents read across the 2026 season, 15k+ rows of results
      - 0 points off the official Sprint Cup standings, rebuilt from raw results
    approach:
      - Structure over prose. Index pages use stat strips, breakdown tables and a short FAQ rather than long guides.
      - A weekly measurement loop against an eight week baseline, with a learnings log that grades each claim as a hypothesis, supported or confirmed.
      - One change per experiment, with a baseline snapshot before shipping, such as before 266 driver pages.
      - A clean domain move from apexinsights.xyz to apexinsights.racing with permanent redirects and a Change of Address.
    what_did_not_work:
      - A 600 word prose guide on the teams page, replaced with a structured page.
      - Hidden headings repeating the team list, which created about 38 duplicate headings and were reverted.
      - Publishing and waiting. A week after launch 6 of 7 story pages were unknown to Google, so sitemaps, IndexNow and manual requests are now part of every release.
    owned: Idea, product, information architecture, design, code, data pipeline, analysis, SEO, stories, podcast and socials.
  - id: flozi
    name: Flozi
    role: Partner, Product & Technical Lead
    period: 2024 to now
    site: https://flozi.io/
    summary: >-
      An AI growth engine for websites. I brought the idea, defined the product,
      prototyped it, ran QA and releases, and lead its AEO growth. My validated
      practice there is building connected topical libraries rather than single
      keyword pages.
