research:
  - id: beyond-rankings
    title: "Beyond Rankings: Measuring Vendor Visibility in AI-Driven Discovery"
    type: Pilot study
    published: 2026-04-01
    url: https://aduttya.com/research/beyond-rankings/
    pdf: https://aduttya.com/beyond-rankings-measuring-vendor-visibility-in-ai-driven-discovery.pdf
    summary: >-
      Why rankings break down in AI search, and ISIC, a four part model
      (Inclusion, Stability, Influence, Coverage) to measure visibility instead.
    findings:
      - AI and Google almost never send buyers to the same vendors. The average Jaccard overlap was 0.03 across 27 B2B queries.
      - 19 of 27 queries had zero overlap between the vendors GPT-4o named and the domains Google ranked.
      - Across 81 GPT-4o responses, the same prompt returned different vendors from run to run, so a ranking is the wrong metric.
    method: >-
      27 queries across 9 problem areas taken from real buyer discussions, Google
      results via SerpAPI, GPT-4o via the Responses API with web search, three runs
      per query, domains mapped to vendors before computing Jaccard overlap.
    citation: "Yadav, A. (2026). Beyond Rankings: Measuring Vendor Visibility in AI-Driven Discovery. Pilot study. https://aduttya.com/research/beyond-rankings/"

